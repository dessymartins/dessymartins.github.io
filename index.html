<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timedoor Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    .hero {
      background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
      min-height: 420px;
    }
    .product-card img {
      height: 200px;
      object-fit: cover;
    }
    .product-card {
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    footer a {
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="navbar" class="fixed-top"></div>

  <!-- Hero Banner -->
  <section class="hero text-white d-flex align-items-center">
    <div class="container py-5">
      <div class="row align-items-center">
        <div class="col-lg-7">
          <span class="badge bg-warning text-dark mb-3">Promo Spesial</span>
          <h1 class="display-4 fw-bold mb-3">Belanja Mudah, Harga Terbaik</h1>
          <p class="lead mb-4">
            Temukan berbagai produk berkualitas dengan pengiriman cepat ke seluruh Indonesia.
            Diskon hingga 50% untuk pembelian pertama!
          </p>
          <a href="#produk" class="btn btn-light btn-lg me-2">Lihat Produk</a>
          <a href="#" class="btn btn-outline-light btn-lg">Pelajari Lebih Lanjut</a>
        </div>
        <div class="col-lg-5 d-none d-lg-block text-center">
          <i class="bi bi-bag-heart" style="font-size: 12rem; opacity: 0.3;"></i>
        </div>
      </div>
    </div>
  </section>

  <!-- List Product -->
  <section id="produk" class="py-5">
    <div class="container">
      <div class="text-center mb-5">
        <h2 class="fw-bold">Produk Terlaris</h2>
        <p>Pilihan produk favorit pelanggan kami</p>
      </div>

      <div class="row g-4">

        <div class="row g-4" id="home-product-list"></div>

        
      </div>
    </div>
  </section>

  <div id="footer"></div>
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/productCard.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
